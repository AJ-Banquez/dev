    <form>
        <div class="check mb-6">

                        </label>
                    </a>

                            </svg>
                        </label>
                    </a>
                    <a href="#" id="formatButton" onclick="modifyAndFormatSql()">

                            <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.651 7.65a7.131 7.131 0 0 0-12.68 3.15M18.001 4v4h-4m-7.652 8.35a7.13 7.13 0 0 0 12.68-3.15M6 20v-4h4"/>
                            </svg>
                        </label>

                    <label for="uploadFile" class="inline-flex justify-center items-center bg-gray-200 p-2 text-gray-500 rounded cursor-pointer hover:text-gray-900 hover:bg-gray-300 dark:text-gray-400 dark:hover:text-white dark:hover:bg-gray-600">
                        <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 12 20">

<script>
window.analyzeQuery = function() {
    var textarea = document.getElementById("sqlQuery");
    if (!textarea) return;
    var query = textarea.value.trim();
    var instances = {};

    query = query.replace(/--.*/g, '');
    query = query.replace(/\/\*[\s\S]*?\*\//g, '');

    var regex = /\b([^\s;.,]+)\s*\.\s*([^\s;.,]+)\b/gi;
    var match;

    var instanceInput = document.getElementById('first_name');
    var instanceName = instanceInput ? instanceInput.value.trim().toLowerCase() : '';

    while ((match = regex.exec(query)) !== null) {
        var currentInstanceName = match[1].trim().toLowerCase();
        var tableName = match[2].trim().toLowerCase();

        if (!instanceName || currentInstanceName === instanceName) {
            if (!instances[tableName]) {
                instances[tableName] = currentInstanceName;
            }
        }
    }

    var tableHtml = `
    <section class="mt-4">
      <div class="relative overflow-hidden bg-white shadow-md dark:bg-gray-800 sm:rounded-lg">
          <div class="flex flex-col px-4 py-3 space-y-3 lg:flex-row lg:items-center lg:justify-between lg:space-y-0 lg:space-x-4">
              <div class="flex items-center flex-1 space-x-4">
                  <h1>
                    <div>
                    <span data-tooltip-target="tooltip-table" class="relative inline-flex items-center p-3 text-sm font-medium text-center text-white bg-blue-700 rounded-lg hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Tablas&nbsp; 
                            <svg class="w-5 h-5 text-white dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-width="2" d="M3 11h18m-9 0v8m-8 0h16a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Z"/>
                            </svg>
                        <div id="tableCount" class="absolute inline-flex items-center justify-center w-6 h-6 text-xs font-bold text-white bg-red-500 border-2 border-white rounded-full -top-2 -end-2 dark:border-gray-900">0</div>
                        </span>
                    </div>
                  </h1>
                  <h1>
                    <button class="relative inline-flex items-center p-3 text-sm font-medium text-center text-white bg-blue-700 rounded-lg hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Operadores&nbsp;
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-percent font-bold" viewBox="0 0 16 16">
                            <path d="M13.442 2.558a.625.625 0 0 1 0 .884l-10 10a.625.625 0 1 1-.884-.884l10-10a.625.625 0 0 1 .884 0M4.5 6a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m0 1a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5m7 6a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m0 1a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5"/>
                            </svg>
                        <div id="mathOperators" class="absolute inline-flex items-center justify-center w-6 h-6 text-xs font-bold text-white bg-red-500 border-2 border-white rounded-full -top-2 -end-2 dark:border-gray-900">No</div>
                    </button>
                  </h1>
              </div>
              <div class="flex flex-col flex-shrink-0 space-y-3 md:flex-row md:items-center lg:justify-end md:space-y-0 md:space-x-3">
                 <button id="copyTableBtn" type="button" onclick="copyTable()" class="flex items-center justify-center flex-shrink-0 px-3 py-2 text-sm font-medium text-gray-900 bg-white border border-gray-200 rounded-lg focus:outline-none hover:bg-gray-100 hover:text-primary-700 focus:z-10 focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700">
                    <svg class="w-4 h-4 mr-2 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 4h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3m0 3h6m-5-4v4h4V3h-4Z"/>
                    </svg>
                    Copiar
                </button>
              </div>
          </div>
          <div class="overflow-x-auto">
            <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
            <table id="resultTable" class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
                <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                    <tr>
                        <th scope="col" class="px-6 py-3">Instancia</th>
                        <th scope="col" class="px-6 py-3">Tabla</th>
                    </tr>
                </thead>
                <tbody>`;

    var foundTables = 0;
    for (var tName in instances) {
        foundTables++;
        var instName = instances[tName];
        tableHtml += `
            <tr>
                <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">${instName.toUpperCase()}</td>
                <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">${tName.toUpperCase()}</td>
            </tr>`;
    }

    tableHtml += `
                </tbody>
            </table>
            </div>    
          </div>
      </div>
    </section>`;

    var resultElement = document.getElementById("analysisResult");
    if (resultElement) resultElement.innerHTML = tableHtml;

    var resetButton = document.getElementById("resetButton");
    if (resetButton) resetButton.style.display = "inline-block";

    var foundMathOperators = Boolean(query.match(/\+|-|\*|\//));
    var tableCountElem = document.getElementById('tableCount');
    var mathOpsElem = document.getElementById('mathOperators');

    if (tableCountElem) tableCountElem.textContent = foundTables;
    if (mathOpsElem) mathOpsElem.textContent = foundMathOperators ? 'Sí' : 'No';
};

window.modifyAndFormatSql = function() {
    var inputSql = document.getElementById("sqlQuery").value.trim();
    if (!inputSql) return;

    inputSql = inputSql.replace(/^=/, '');
    inputSql = inputSql.replace(/"/g, '');
    inputSql = inputSql.replace(/vbcrlf/gi, '');
    inputSql = inputSql.replace(/&/g, '');

    try {
        if (window.sqlFormatter && typeof window.sqlFormatter.format === 'function') {
            var formattedSql = window.sqlFormatter.format(inputSql, { language: 'sql' });
            document.getElementById("sqlQuery").value = formattedSql;
        } else {
            document.getElementById("sqlQuery").value = inputSql;
        }
    } catch (e) {
        console.error("Error al formatear SQL:", e);
        document.getElementById("sqlQuery").value = inputSql;
    }
    detectInstance();
};

window.detectInstance = function() {
    var textarea = document.getElementById('sqlQuery');
    if (!textarea) return;
    var query = textarea.value;

    var match = query.match(/(?:from|join)\s+([^\s;.]+)\.\s*([^\s;.]+)/i);

    var formContainer = document.getElementById('formContainer');
    var instanceInput = document.getElementById('first_name');

    if (match && match[1]) {
        if (instanceInput) instanceInput.value = match[1].trim();
        if (formContainer) formContainer.style.display = 'block';
    } else {
        if (formContainer) formContainer.style.display = 'none';
    }
};

window.resetForm = function() {
    var textarea = document.getElementById('sqlQuery');
    if (textarea) textarea.value = '';

    var instanceInput = document.getElementById('first_name');
    if (instanceInput) instanceInput.value = '';

    var analysisResult = document.getElementById('analysisResult');
    if (analysisResult) analysisResult.innerHTML = '';

    var resetButton = document.getElementById('resetButton');
    if (resetButton) resetButton.style.display = 'none';

    var uploadFileInput = document.getElementById('uploadFile');
    if (uploadFileInput) uploadFileInput.value = '';

    var formContainer = document.getElementById('formContainer');
    if (formContainer) formContainer.style.display = 'none';
};

window.handleFileUpload = function(event) {
    const file = event.target.files[0];
    const textarea = document.getElementById('sqlQuery');

    if (file && textarea) {
        const extension = file.name.split('.').pop().toLowerCase();
        if (extension === 'txt' || extension === 'sql') {
            const reader = new FileReader();
            reader.onload = function() {
                textarea.value = reader.result;
                detectInstance();
            };
            reader.readAsText(file);
        } else {
            alert("Por favor, selecciona un archivo .txt o .sql");
        }
    }
};

window.copyTable = function() {
    var table = document.getElementById('resultTable');
    if (!table) return;
    var rows = table.querySelectorAll('tbody tr');
    var copiedText = '';

    rows.forEach(function(row) {
        var rowData = '';
        var cells = row.querySelectorAll('td');
        cells.forEach(function(cell, index) {
            rowData += cell.textContent.trim();
            if (index < cells.length - 1) {
                rowData += '\t';
            }
        });
        copiedText += rowData + '\n';
    });

    navigator.clipboard.writeText(copiedText).then(function() {
        var copyBtn = document.getElementById('copyTableBtn');
        if (copyBtn) {
            copyBtn.innerHTML = `
                <svg class="w-4 h-4 mr-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                    <path fill-rule="evenodd" d="M9 2a1 1 0 0 0-1 1H6a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-2a1 1 0 0 0-1-1H9Zm1 2h4v2h1a1 1 0 1 1 0 2H9a1 1 0 0 1 0-2h1V4Zm5.707 8.707a1 1 0 0 0-1.414-1.414L11 14.586l-1.293-1.293a1 1 0 0 0-1.414 1.414l2 2a1 1 0 0 0 1.414 0l4-4Z" />
                </svg>
                Copiado
            `;
            copyBtn.disabled = true;
            setTimeout(function() {
                copyBtn.innerHTML = `
                <svg class="w-4 h-4 mr-2 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 4h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3m0 3h6m-5-4v4h4V3h-4Z"/>
                </svg>
                Copiar
                `;
                copyBtn.disabled = false;
            }, 5000);
        }
    }).catch(function() {
        alert('No se pudo copiar el texto.');
    });
};

document.addEventListener("DOMContentLoaded", function() {
    var textarea = document.getElementById("sqlQuery");
    var formContainer = document.getElementById("formContainer");
    var deleteButton = document.getElementById("deleteButton");
    var copyButton = document.getElementById("copyButton");

    function toggleDeleteButton() {
        if (textarea && textarea.value.trim() !== "") {
            if (deleteButton) deleteButton.style.display = "inline-block";
            if (formContainer) formContainer.style.display = "block";
        } else {
            if (deleteButton) deleteButton.style.display = "none";
            if (formContainer) formContainer.style.display = "none";
        }
    }

    function clearContent() {
        if (textarea) textarea.value = "";
        if (formContainer) formContainer.style.display = "none";
        if (deleteButton) deleteButton.style.display = "none";
    }

    if (textarea) textarea.oninput = function() {
        toggleDeleteButton();
        detectInstance();
    };

    if (deleteButton) deleteButton.onclick = clearContent;

    if (copyButton) {
        copyButton.onclick = function() {
            var textareaContent = document.getElementById("sqlQuery").value;
            navigator.clipboard.writeText(textareaContent);
            
            var copyIcon = document.getElementById("copyIcon");
            if (copyIcon) {
                copyIcon.innerHTML = `
                    <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">

                        <path fill-rule="evenodd" d="M14 3.054V7h-3.8c.074-.154.168-.3.282-.432l2.46-2.87A2 2 0 0 1 14 3.054ZM16 3v4a2 2 0 0 1-2 2h-4v6a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-3Z" clip-rule="evenodd"/>

                            <path stroke="currentColor" stroke-linejoin="round" stroke-width="2" d="M9 8v3a1 1 0 0 1-1 1H5m11 4h2a1 1 0 0 1 1 1V5a1 1 0 0 1-1-1h-7a1 1 0 0 1-1 1v1m4 3v10a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-7.13a1 1 0 0 1 .24-.65L7.7 8.35A1 1 0 0 1 8.46 8H13a1 1 0 0 1 1 1Z"/>
